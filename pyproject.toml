[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dylathleen"
description = "Graphical interface to manage Linux applications (AppImage, Flatpak, Snap and Web Apps)"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dynamic = ["version"]
readme = "README.md"
authors = [{name = "Vinicius Moreira", email = "vinicius_fmoreira@hotmail.com"}]
maintainers = [{name = "Konkere", email = "amorph@konkere.ru"}]

dependencies = [
    "pyqt5 >= 5.12",
    "requests >= 2.18",
    "packaging",
    "colorama >= 0.3.8",
    "pyyaml >= 3.13",
    "python-dateutil >= 2.7"
]

[project.optional-dependencies]
web = [
    "lxml >= 4.2.0",
    "beautifulsoup4 >= 4.7.0"
]

[project.scripts]
dylathleen = "dylathleen.app:main"
dylathleen-tray = "dylathleen.app:tray"
dylathleen-cli = "dylathleen.cli.app:main"

[project.urls]
Repository = "https://github.com/konkere/dylathleen"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "dylathleen.__version__"}

[tool.setuptools.packages.find]
include = ["dylathleen*"]
exclude = ["dylathleen.gems.arch*", "dylathleen.gems.debian*"]
