<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Dylath-Leen — Rounded-Square Twilight Citadel</title>
  <defs>
    <linearGradient id="twilight-sky" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="360">
      <stop offset="0%" stop-color="#2D435D"/>
      <stop offset="50%" stop-color="#537089"/>
      <stop offset="100%" stop-color="#829EB1"/>
    </linearGradient>
    <linearGradient id="harbor-water" gradientUnits="userSpaceOnUse" x1="0" y1="346" x2="0" y2="472">
      <stop offset="0%" stop-color="#21A5AF"/>
      <stop offset="45%" stop-color="#137E88"/>
      <stop offset="100%" stop-color="#0B4F59"/>
    </linearGradient>
    <linearGradient id="reflection-grad" gradientUnits="userSpaceOnUse" x1="0" y1="354" x2="0" y2="472">
      <stop offset="0%" stop-color="#0D3C47" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#0B4B56" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="beacon-grad" gradientUnits="userSpaceOnUse" x1="0" y1="184" x2="0" y2="224">
      <stop offset="0%" stop-color="#FDE3A2"/>
      <stop offset="55%" stop-color="#E8B663"/>
      <stop offset="100%" stop-color="#D5A45B"/>
    </linearGradient>
  </defs>

  <g id="icon-twilight">
    <!-- Pre-clipped twilight sky backdrop matching outer rounded corners (r=96) -->
    <path id="sky-backdrop" d="
      M 40,356
      L 40,136
      A 96,96 0 0 1 136,40
      L 376,40
      A 96,96 0 0 1 472,136
      L 472,292
      L 424,316
      L 424,356 Z
    " fill="url(#twilight-sky)"/>

    <!-- Pre-clipped harbor bay water and reflections strictly within the rounded-square silhouette -->
    <g id="harbor-layer">
      <path id="water-base" d="
        M 40,346
        L 412,346
        L 412,416
        L 392,456
        L 330,470
        L 210,472
        L 136,472
        A 96,96 0 0 1 40,376 Z
      " fill="url(#harbor-water)"/>
      <polygon id="reflection-left" points="160,354 216,354 226,471.5 210,472 174,472" fill="url(#reflection-grad)"/>
      <polygon id="reflection-center" points="232,354 316,354 327,462 246,471" fill="url(#reflection-grad)"/>
      <polygon id="reflection-right" points="328,354 408,354 408,422 392,444 337,460" fill="url(#reflection-grad)"/>
    </g>

    <!-- Monolithic tilted basalt citadel and curved harbor shoreline -->
    <g id="citadel-layer">
      <!-- Crisp light-catching basalt facets along outer left/upper silhouettes -->
      <path id="citadel-edge-highlights" d="
        M 80,356
        L 150,316
        L 180,158
        L 228,132
        L 228,144
        L 192,165
        L 162,322
        L 96,356 Z
      " fill="#6D859A"/>
      <polygon id="facet-tower-center" points="218,298 252,110 308,78 308,92 264,120 228,294" fill="#768FA4"/>
      <polygon id="facet-tower-right" points="322,148 372,158 372,170 330,162 325,234 318,230" fill="#657D92"/>

      <!-- Main unified dark charcoal basalt silhouette with native bottom-right arc (r=96) -->
      <path id="citadel-mass" d="
        M 80,356
        L 156,318
        L 190,164
        L 228,142
        L 222,292
        L 230,288
        L 262,118
        L 308,90
        L 302,218
        L 320,228
        L 326,158
        L 372,168
        L 384,254
        L 418,270
        L 426,312
        L 472,288
        L 472,376
        A 96,96 0 0 1 376,472
        L 210,472
        C 332,464 404,442 404,408
        C 404,370 292,356 80,356 Z
      " fill="#1C232F"/>

      <!-- Pre-clipped foreground basalt buttresses fitted analytically to the bay shoreline curve -->
      <g id="bastion-steps">
        <path id="buttress-mid-body" d="
          M 276,256
          L 332,238
          L 353.03,373.76
          C 328.73,367.91 295.86,363.66 254.69,360.79 Z
        " fill="#151B25"/>
        <polygon id="buttress-mid-edge" points="266,332 276,256 332,238 332,248 285,264 271,332" fill="#5A7085"/>
        <path id="buttress-right-body" d="
          M 370,284
          L 418,266
          L 446,422
          L 404,408
          C 404,393.10 386.78,381.89 353.06,373.77 Z
        " fill="#151B25"/>
        <polygon id="buttress-right-edge" points="362,344 370,284 418,266 418,276 379,292 366,344" fill="#5A7085"/>
      </g>

      <!-- Radiant warm amber beacon slit integrated into the right tower -->
      <polygon id="amber-beacon" points="344,184 356,186 359,224 342,222" fill="url(#beacon-grad)"/>
    </g>

    <!-- Subtle inner contour for dark desktop theme separation -->
    <rect id="inner-rim" x="41.5" y="41.5" width="429" height="429" rx="94.5" ry="94.5" fill="none" stroke="#89A6B8" stroke-opacity="0.22" stroke-width="3"/>
  </g>
</svg>
