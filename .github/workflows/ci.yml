name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          ./packaging/build-deb
          sha256sum dist/*.deb > /tmp/expected
          ./packaging/build-deb
          sha256sum -c /tmp/expected
      - uses: actions/upload-artifact@v4
        with:
          name: dylathleen-deb
          path: dist/*.deb
  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04', 'debian:12', 'debian:13']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dylathleen-deb
          path: dist
      - run: ./packaging/check-distribution
      - name: Test bin with the Jammy package
        if: matrix.image == 'ubuntu:22.04'
        run: |
          apt-get -qy --no-install-recommends install ca-certificates curl
          mkdir -p /tmp/dylathleen-bin
          curl -fsSL --retry 3 https://github.com/marcosnils/bin/releases/download/v0.29.4/bin_0.29.4_linux_amd64 -o /tmp/dylathleen-bin/bin
          echo 'f7a179a813675bde2d8cf0ad3b4ae1d7bb1c6732daf623fb8deeba9f5f4782a7  /tmp/dylathleen-bin/bin' | sha256sum -c
          chmod 755 /tmp/dylathleen-bin/bin
          cd /tmp
          PATH="/tmp/dylathleen-bin:$PATH" PYTHONPATH="/usr/lib/dylathleen:$GITHUB_WORKSPACE" python3 -m unittest tests.gems.bin.test_integration
      - name: Test deb-get with the Jammy package
        if: matrix.image == 'ubuntu:22.04'
        run: |
          apt-get -qy --no-install-recommends install sudo jq curl wget lsb-release distro-info-data gpg
          curl -fsSL --retry 3 https://github.com/wimpysworld/deb-get/releases/download/0.4.7/deb-get_0.4.7-1_all.deb -o /tmp/deb-get.deb
          echo '8164b6019a10f0c8ffd91f347f4bf198d4a08ef036fd9cdddf2c9c4cdc6017ca  /tmp/deb-get.deb' | sha256sum -c
          dpkg-deb -x /tmp/deb-get.deb /tmp/debget-native
          install -m755 /tmp/debget-native/usr/bin/deb-get /usr/bin/deb-get
          install -m440 /dev/null /etc/sudoers.d/dylathleen-ci
          echo 'tester ALL=(root) NOPASSWD: ALL' > /etc/sudoers.d/dylathleen-ci
          cd /tmp
          DYLATHLEEN_TEST_CONTAINER=1 PYTHONPATH=/usr/lib/dylathleen python3 "$GITHUB_WORKSPACE/packaging/check-debget.py"
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          ./packaging/build-deb
          sudo apt-get install -y ./dist/*.deb
          PYTHONPATH=. /usr/bin/python3 packaging/check-flatpak.py
